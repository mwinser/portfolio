<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Alden Winser's portfolio"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <!-- Preconnect to Google Fonts to speed up font fetching -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load fonts via link instead of CSS @import to reduce FOUT -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200..900&family=Inter:wght@200..900&display=swap" rel="stylesheet">

    <!-- Fade in the app once fonts are ready -->
    <style>
      html.fonts-loading #root { opacity: 0; }
      html.fonts-loaded #root { opacity: 1; transition: opacity .3s ease; }

      /* Pre-font full-screen spinner */
      #pre-font-spinner {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgb(26, 35, 126), rgb(13, 18, 63));
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
      }
      html.fonts-loading #pre-font-spinner { opacity: 1; pointer-events: auto; }
      html.fonts-loaded #pre-font-spinner { opacity: 0; transition: opacity .2s ease; }
      #pre-font-spinner .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.25);
        border-top-color: #00bcd4;
        border-radius: 50%;
        animation: prefont-spin 1s linear infinite;
      }
      @keyframes prefont-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      (function(){
        var root = document.documentElement;
        root.classList.add('fonts-loading');
        function show(){
          root.classList.remove('fonts-loading');
          root.classList.add('fonts-loaded');
          var s = document.getElementById('pre-font-spinner');
          if (s && s.parentNode) { s.parentNode.removeChild(s); }
        }
        try {
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(show, show);
            setTimeout(show, 2000); // fallback in case fonts hang
          } else {
            show();
          }
        } catch (e) { show(); }
      })();
    </script>

    <title>Alden Winser's Portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="pre-font-spinner" aria-live="polite" aria-busy="true">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
    <div id="root"></div>
  </body>
</html>
